<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>커뮤니티 페이지 - 베지어스</title>
    <link rel="stylesheet" href="community.css"> 
    <link rel="icon" href="../../assets/images/logo.ico" type="image/x-icon">
</head>
<body>

    <!------------------------- 네비게이션바 ------------------------->
    <nav class="navbar">
        <div class="navbar_container">
            <a href="../../index.html" class="navbar_logo">
                <img src="../../assets/images/logo.png" alt="로고">
            </a>

            <ul class="navbar_menu">
                <li><a href="../../index.html" class="nav_item">HOME</a></li>
                <li><a href="../recipe/recipe_main.html" class="nav_item">RECIPE</a></li>
                <li><a href="../map/map.html" class="nav_item">MAP</a></li>
                <li><a href="../community/community.html" class="nav_item">COMMUNITY</a></li>
                <li><a href="../mypage/mypage.html" class="nav_item">MYPAGE</a></li>
            </ul>

            <div class="navbar_icons">
                <a href="../../pages/login/login.html"><img src="../../assets/images/login_dark.png" alt="login/out"></a>
                <a href="#"><img src="../../assets/images/setting_dark.png" alt="Settings"></a>
            </div>
        </div>
    </nav>

    
    <!------------------------- 메인 컨테이너 ------------------------->
    <div class="community_container">
        <main class="community_main_content">

            <!------------------------- 왼쪽 섹션 ------------------------->
            <div class="community_left_section">

                <!---------------- HOT TOPIC ---------------->
                <section class="community_hot_topic_section">
                    <h2 class="community_hot_topic_title">HOT TOPIC!</h2>
                    <div class="community_hot_topic_underline"></div>
                    <div class="community_hot_topic_list"></div>
                </section>

                <!---------------- 게시판 탭 ---------------->
                <section class="community-section">

                    <div class="community_tab_buttons">
                        <button class="community_tab_button active">자유 게시판</button>
                        <button class="community_tab_button">질문 게시판</button>
                        <button class="community_tab_button">후기 게시판</button>
                    </div>

                    <!---------------- 게시글 리스트 ---------------->
                    <div class="community_post_list"></div>

                </section>

            </div>


            <!------------------------- 오른쪽 섹션 ------------------------->
            <aside class="community_right_section">

                <!--------------- 검색 ---------------->
                <div class="community_search_box_wrap community_search_box">
                    <input type="text" placeholder="Search" class="community_search_input">
                </div>

                <!--------------- New Task 기본 글쓰기 박스 --------------->
                <section class="community_new_task_section community_write_box"> 

                    <div class="community_write_box_header">
                        <h3 class="community_task_header">New Task</h3>
                        <button class="open_modal_button">
                            <img src="../../assets/images/expand.png" class="expand_icon">
                        </button>
                    </div> 

                    <div class="community_form_group">
                        <label for="community_task_title">Title</label>
                        <input type="text" id="community_task_title" class="community_input_field">
                    </div>

                    <div class="community_form_group">
                        <label>Description</label>
                        <textarea id="community_task_description" class="community_input_field"></textarea>
                    </div>

                    <div class="community_form_group">
                        <label>Pics</label>
                        <div class="community_pics_upload community_upload_box">
                            <img src="../../assets/images/Download.png" alt="파일 업로드">
                        </div>
                    </div>

                    <button class="community_create_new_button community_button">Create New</button>

                </section>
            </aside>
        </main>
    </div>


    <!------------------------- 팝업 글쓰기 모달 ------------------------->
    <div class="write_modal_overlay" id="writeModal">
        <div class="write_modal">

            <button class="write_modal_close">&times;</button>
            <h2>New Post</h2>

            <div class="modal_form_group">
                <label>Title</label>
                <input type="text" id="modal_title" class="modal_input">
            </div>

            <div class="modal_form_group">
                <label>Description</label>
                <textarea id="modal_desc" class="modal_textarea"></textarea>
            </div>

            <div class="modal_form_group">
                <label>Pics</label>
                <div class="modal_upload_box">
                    <img src="../../assets/images/Download.png" id="modal_upload_icon">
                </div>
                <input type="file" id="modal_file_input" style="display:none;" accept="image/*">
            </div>

            <button class="modal_submit_button">Create New</button>

        </div>
    </div>


    <!------------------------- JS 연결 ------------------------->
    <script src="community.js"></script>
</body>
</html>
