<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>커뮤니티 페이지 - 글 확인 페이지</title>

    <!-- 공통 CSS -->
    <link rel="stylesheet" href="../../assets/css/7_베지어스_common.css">

    <link rel="stylesheet" href="7_베지어스_community_post_wide.css">

    <link rel="icon" href="../../assets/images/7_logo.ico" type="image/x-icon">
</head>
<body>

    <div class="post_wide_container">

        <!-- 왼쪽 -->
        <div class="post_left_section">

            <section class="post_main_box">

                <div class="post_user_header">
                    <img src="../../assets/images/7_Profile3.png" class="post_user_profile">
                    <span class="post_user_name">user1</span>
                    <img class="post_user_badge" src="../../assets/images/7_badge_icon1.png">
                </div>

                <div class="post_content_box">
                    <h2 class="post_title">Title</h2>

                    <div class="post_content_area">
                        <div class="post_text"></div>
                        <div class="post_image_area"></div>
                    </div>
                </div>

                <!-- 좋아요 버튼 -->
                <div class="post_like_area">
                    <img class="post_like_icon" src="../../assets/images/7_Heart_empty.png">
                    <span class="post_like_count">0</span>
                </div>

            </section>

            <!-- 댓글 리스트 -->
            <section class="comment_section"></section>

            <!-- 댓글 작성 -->
            <section class="comment_write_box">
                <div class="comment_write_header">
                    <span>댓글 작성</span>
                </div>
                <textarea id="commentInput" class="comment_textarea" placeholder="따뜻한 댓글을 남겨주세요!"></textarea>
                <div class="comment_submit_wrapper">
                    <button id="btnCommentSubmit" class="btn_comment_submit">등록하기</button>
                </div>
            </section>

        </div>

        <!-- HOT TOPIC -->
        <aside class="post_right_section">
            <h3 class="hot_topic_title">HOT TOPIC!</h3>
            <div class="hot_topic_underline"></div>
            <div class="hot_topic_list"></div>
        </aside>

    </div>

    <!-- 공통 레이아웃 JS -->
    <script src="../../assets/js/7_베지어스_layout.js"></script>
    <script src="7_베지어스_community_post_wide.js"></script>
</body>
</html>
