<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>레시피 상세 - 베지어스</title>
    <link rel="stylesheet" href="../../assets/css/common.css">
    <link rel="stylesheet" href="recipe_style.css">
    <link rel="icon" href="../../assets/images/logo.ico" type="image/x-icon">
</head>
<body>
    <div class="recipe_detail_wrapper">
        <div class="recipe_hero">
            <div class="recipe_hero_image" id="recipeHeroImage"></div>
            
            <div class="recipe_hero_info">
                <h1 id="recipeTitle"></h1>
                
                <div class="author_info">
                    <span class="author_badge">Writer</span>
                    <span id="recipeAuthor"></span>
                </div>

                <div class="recipe_bookmark_container">
                    <input type="checkbox" id="recipeBookmark" class="recipe_bookmark_checkbox">
                    <label for="recipeBookmark" class="recipe_bookmark_label">
                        <img src="../../assets/images/chk_bookmark.png" alt="북마크 완료">
                    </label>
                </div>
                
                <p id="recipeDescription"></p> 
                
                <div class="recipe_meta_info">
                    <span id="metaServings"><img src="../../assets/images/served.png" alt="인분"> </span>
                    <span id="metaTime"><img src="../../assets/images/time.png" alt="소요시간"> </span>
                    <span id="metaDifficulty"><img src="../../assets/images/difficulty.png" alt="난이도"> </span>
                </div>
                
                <div class="recipe_hashtags" id="recipeHashtags">
                </div>
            </div>
        </div>

        <div class="recipe_main_content">
            <div class="recipe_ingredients_box">
                <h3>재료</h3>
                <div id="ingredientContainer"></div>
            </div>
            
            <div class="recipe_steps_box">
                <h3>만드는 법</h3>
                <ol class="recipe_step_list" id="stepList">
                </ol>
            </div>
        </div>
        
        <div class="recipe_review_section">
            <h3>생생 후기 <span id="reviewCountBadge" style="font-size:14px; color:#688F4E;">(0)</span></h3>
            
            <div class="review_input_container">
                <div class="review_header">
                    <span style="font-weight:bold; color:#2B463C;">후기 작성</span>
                    <div class="star_rating_select" id="starContainer">
                        <span class="star_btn selected" data-value="1">★</span>
                        <span class="star_btn selected" data-value="2">★</span>
                        <span class="star_btn selected" data-value="3">★</span>
                        <span class="star_btn selected" data-value="4">★</span>
                        <span class="star_btn selected" data-value="5">★</span>
                    </div>
                </div>
                <textarea id="reviewText" class="review_textarea" rows="3" placeholder="레시피에 대한 솔직한 후기를 남겨주세요!"></textarea>
                <div style="overflow:hidden;"> 
                    <button type="button" class="btn_review_submit" onclick="submitReview()">등록하기</button>
                </div>
            </div>

            <div class="recipe_review_list" id="reviewListContainer">
            </div>
        </div>
    </div>
    <script src="../../assets/js/layout.js"></script>
    <script src="recipe_detail.js"></script>
</body>
</html>
