<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>지도 - 베지어스</title>
    <link rel="stylesheet" href="map_style.css" />
    <link rel="icon" href="../../assets/images/logo.ico" type="image/x-icon">
</head>
<body>

    <!-- 공유 팝업 -->
    <div class="share_popup" id="share_popup">
        <div class="share_popup_content">
            <h3>지도 공유</h3>
            <p>아래 링크를 복사하세요</p>

            <input type="text" id="share_link_input" readonly />
            <button id="share_copy_btn">복사</button>
            <button id="share_close_btn" class="close_btn">닫기</button>
        </div>
    </div>

    <!-- 네비게이션 바 -->
    <nav class="navbar">
        <div class="navbar_container">
            <a href="../../index.html" class="navbar_logo">
                <img src="../../assets/images/logo.png" alt="로고" />
            </a>
            <ul class="navbar_menu">
                <li><a href="../../index.html" class="nav_item">HOME</a></li>
                <li><a href="../recipe/recipe_main.html" class="nav_item">RECIPE</a></li>
                <li><a href="../map/map.html" class="nav_item">MAP</a></li>
                <li><a href="../community/community.html" class="nav_item">COMMUNITY</a></li>
                <li><a href="../mypage/mypage.html" class="nav_item">MYPAGE</a></li>
            </ul>
            <div class="navbar_icons">
                <a href="../../pages/login/login.html"><img src="../../assets/images/login_dark.png" alt="login/out"></a>
                <a href="#"><img src="../../assets/images/setting_dark.png" alt="Settings" /></a>
            </div>
        </div>
    </nav>

    <!-- 본문 -->
    <div class="content_wrapper">

        <!-- 검색 필터 영역 -->
        <div class="map_search_filter_container">
            <div class="map_select">
                <select>
                    <option>지역 선택</option>
                    <option>서울</option>
                    <option>경기도</option>
                    <option>강원도</option>
                    <option>충청북도</option>
                    <option>충청남도</option>
                    <option>전라북도</option>
                    <option>전라남도</option>
                    <option>경상북도</option>
                    <option>경상남도</option>
                    <option>제주도</option>
                </select>
            </div>

            <div class="map_filter_box">
                <div class="map_filter_row">
                    <div class="map_filter_item">
                        <input type="checkbox" id="chk_fruit" />
                        <label for="chk_fruit" class="map_filter_button">과일</label>
                    </div>
                    <div class="map_filter_item">
                        <input type="checkbox" id="chk_veg" />
                        <label for="chk_veg" class="map_filter_button">채소</label>
                    </div>
                    <div class="map_filter_item">
                        <input type="checkbox" id="chk_dairy" />
                        <label for="chk_dairy" class="map_filter_button">유제품</label>
                    </div>
                    <div class="map_filter_item">
                        <input type="checkbox" id="chk_egg" />
                        <label for="chk_egg" class="map_filter_button">달걀</label>
                    </div>
                    <div class="map_filter_item">
                        <input type="checkbox" id="chk_seafood" />
                        <label for="chk_seafood" class="map_filter_button">해산물</label>
                    </div>
                    <div class="map_filter_item">
                        <input type="checkbox" id="chk_poultry" />
                        <label for="chk_poultry" class="map_filter_button">가금류</label>
                    </div>
                    <div class="map_filter_item">
                        <input type="checkbox" id="chk_meat" />
                        <label for="chk_meat" class="map_filter_button">육류</label>
                    </div>
                </div>
            </div>

            <div class="map_search_box">
                <input type="text" placeholder="식당 검색" />
            </div>
        </div>

        <!-- 식당 정보 + 지도 -->
        <div class="map_and_card_section">
            <div class="map_card_outer_container">

                <!-- X 버튼 -->
                <div class="map_card_close_btn">
                    <img src="map_image/close.png" alt="close" />
                </div>

                <!-- 식당 정보 카드 -->
                <div class="map_card">
                    <img src="../../assets/images/map_restaurant.png" alt="식당 이미지" />
                    <div class="map_card_info">
                        <h3>OO비건식당</h3>
                        <a href="#tab_review_link" class="review_link">리뷰 0</a>

                        <div class="map_card_action">
                            <div class="map_card_action_button favorite_btn">
                                <img src="../../assets/images/map_favorite.png" alt="저장" />
                                <span>저장</span>
                                <div class="divider"></div>
                            </div>
                            <div class="map_card_action_button share_btn" id="share_button">
                                <img src="../../assets/images/map_share.png" alt="공유" />
                                <span>공유</span>
                            </div>
                        </div>

                        <div class="map_card_tag"></div>
                    </div>
                </div>

                <!-- 메뉴/리뷰/사진/정보 탭 -->
                <div class="map_tab_card">
                    <div class="map_tab_card_inner">

                        <input id="tab_home" type="radio" name="map_tab" checked />
                        <input id="tab_menu" type="radio" name="map_tab" />
                        <input id="tab_review" type="radio" name="map_tab" />
                        <input id="tab_photo" type="radio" name="map_tab" />
                        <input id="tab_info" type="radio" name="map_tab" />

                        <div class="map_tab_card_label">
                            <label for="tab_home">홈</label>
                            <label for="tab_menu">메뉴</label>
                            <label for="tab_review">리뷰</label>
                            <label for="tab_photo">사진</label>
                            <label for="tab_info">정보</label>
                        </div>

                        <div class="map_tab_card_panel">

                            <!-- 홈 -->
                            <div id="tab_home_link" class="map_tab_panel">
                                <div class="tab_info">
                                    <h4><img src="../../assets/images/location.png"> 위치</h4>
                                    <p></p>
                                </div>
                                <div class="tab_info">
                                    <h4><img src="../../assets/images/opening_hours.png"> 영업시간</h4>
                                    <p></p>
                                </div>
                                <div class="tab_info">
                                    <h4><img src="../../assets/images/call.png"> 전화번호</h4>
                                    <p></p>
                                </div>
                                <div class="tab_info">
                                    <h4><img src="../../assets/images/restaurant_info.png"> 가게 정보</h4>
                                    <p></p>
                                </div>
                            </div>

                            <!-- 메뉴 -->
                            <div id="tab_menu_link" class="map_tab_panel"></div>

                            <!-- 리뷰 탭 -->
                            <div id="tab_review_link" class="map_tab_panel">

                                <button id="map_review_write_btn" class="map_review_write_btn">
                                    리뷰 작성
                                </button>

                            </div>

                            <!-- 사진 -->
                            <div id="tab_image_link" class="map_tab_panel">
                                <div class="tab_image_row"></div>
                            </div>

                            <!-- 정보 -->
                            <div id="tab_info_link" class="map_tab_panel">
                                <div class="tab_info">
                                    <h4>소개</h4>
                                    <p></p>
                                </div>
                            </div>

                        </div> <!-- map_tab_card_panel end -->
                    </div>
                </div>

            </div>

            <!-- 지도 -->
            <div class="map_container">
                <div id="map"></div>
                <img id="fav_button" src="map_image/fav.png" class="map_button">
                <img id="gps_button" src="map_image/gps.png" class="map_button gps_button">
            </div>
        </div>
    </div>

    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=6cfa4152ca4584c70500553be887a310"></script>
    <script src="map_script.js"></script>
</body>
</html>
