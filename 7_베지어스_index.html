<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>베지어스</title>
    <link rel="stylesheet" href="assets/css/7_베지어스_common.css">
    <link rel="stylesheet" href="pages/recipe/7_베지어스_recipe_style.css">
    <link rel="stylesheet" href="7_베지어스_index_style.css">
    <link rel="icon" href="./assets/images/7_logo.ico" type="image/x-icon">
</head>

<body>
    <header class="hero_split">
        <div class="hero_split_text">
            <div class="hero_text_content">
                <div class="project_name_wrapper">
                    <p class="project_name">베지어스</p>
                    <img src="assets/images/7_leaf.png" alt="나뭇잎" class="leaf_icon">
                </div>
                <h1>지구와 우리를 위한, <br>맛있는 한 끼</h1>
                <p>당신의 식탁을 풍성하게 할 특별한 비건 레시피를 만나보세요.</p>
                <a href="pages/recipe/7_베지어스_recipe_main.html" class="cta_button">모든 레시피 보기</a>
            </div>
        </div>
        <div class="hero_split_image">
            <div class="slider_container">

                <div class="slider_track" id="hero-slider-track">
                    <div class="slide">
                        <img src="./assets/images/7_hero_main.png" alt="메인 포스터 1">
                    </div>
                    <div class="slide">
                        <img src="./assets/images/7_hero_slide_2.png" alt="메인 포스터 2">
                    </div>
                    <div class="slide">
                        <img src="./assets/images/7_hero_slide_3.png" alt="메인 포스터 3">
                    </div>
                </div>

                <button class="slider_btn prev" id="btn-prev">❮</button>
                <button class="slider_btn next" id="btn-next">❯</button>

                <div class="slider_dots" id="slider-dots">
                </div>
            </div>
        </div>
    </header>

    <section class="banner_section">
        <a href="pages/login/7_베지어스_login.html" id="login_banner">
            <img src="assets/images/7_banner.png" alt="가입 환영 배너" class="banner_image"></a>
    </section>

    <main class="content_wrapper">
        <section class="featured_recipes">
            <h2>지금, 인기 레시피</h2>
            <div class="recipe_grid" id="featured-recipe-list">
            </div>
        </section>

        <section class="rmd_community">
            <h2>추천 포스트</h2>
            <div class="community_post_list" id="rmd_post_list">
            </div>
        </section>

        <section class="site_features">
            <h2>주요 기능 둘러보기</h2>
            <div class="features_grid">
                <div class="feature_item">
                    <a href="./pages/recipe/7_베지어스_recipe_main.html">
                        <img src="assets/images/7_recipe_icon.png" alt="레시피 아이콘">
                        <h3>레시피</h3>
                        <p>누구나 쉽게 따라하는<br>다양한 비건 레시피</p>
                    </a>
                </div>
                <div class="feature_item">
                    <a href="./pages/map/7_베지어스_map.html">
                        <img src="assets/images/7_map_icon.png" alt="지도 아이콘">
                        <h3>맛집 지도</h3>
                        <p>우리 동네 비건 맛집을<br>한눈에 찾아보세요</p>
                    </a>
                </div>
                <div class="feature_item">
                    <a href="./pages/community/7_베지어스_community.html">
                        <img src="assets/images/7_community_icon.png" alt="커뮤니티 아이콘">
                        <h3>커뮤니티</h3>
                        <p>나만의 꿀팁과 후기를<br>자유롭게 나눠보세요</p>
                    </a>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer"></footer>
    <script src="./7_베지어스_index.js"></script>
    <script src="assets/js/7_베지어스_layout.js"></script>
</body>

</html>
